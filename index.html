<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Tifa ❤️</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI','Poppins',sans-serif; }
  body {
    min-height:100vh;
    background: linear-gradient(145deg,#fff0f5 0%,#ffe6f0 100%);
    display:flex; justify-content:center; align-items:center;
    padding:16px;
  }
  .game-container {
    width:100%; max-width:700px;
    background: rgba(255,255,255,.9);
    backdrop-filter: blur(12px);
    border-radius:48px;
    box-shadow: 0 25px 50px -8px rgba(180,100,140,.3), 0 0 0 2px rgba(255,215,225,.6);
    padding:32px 28px;
    border:1px solid #ffe2ed;
  }
  h1,h2,h3,p { text-align:center; color:#4b2e3b; }
  .emoji-big { font-size:3.5rem; text-align:center; margin-bottom:8px; cursor:pointer; user-select:none; }
  .question-text { font-size:1.7rem; font-weight:500; margin:16px 0 24px; color:#6b3a4b; }
  .small-question { font-size:1.2rem; color:#8a5a6b; margin-bottom:20px; }
  textarea, input[type="text"] {
    width:100%; padding:18px 22px; border-radius:40px;
    border:1.5px solid #ffc1d6; background:#fffafc;
    font-size:1.1rem; outline:none; color:#3e2a33;
    box-shadow: inset 0 2px 6px rgba(255,210,225,.4);
  }
  textarea:focus, input:focus { border-color:#ff92b0; background:#fff; }
  .btn-group { display:flex; flex-wrap:wrap; justify-content:center; gap:14px; margin-top:18px; }
  .btn {
    background:#ffd9e6; border:none; padding:14px 36px;
    border-radius:60px; font-size:1.15rem; font-weight:500;
    color:#612f42; cursor:pointer; transition:all .2s;
    box-shadow: 0 6px 0 #dbaec2, 0 8px 20px rgba(220,130,160,.3);
  }
  .btn:hover { background:#ffc1d6; transform:translateY(-2px); }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 #c98da8; }
  .btn-secondary {
    background:#f5e6ed; box-shadow:0 4px 0 #cfb1c2; color:#5c3b4a;
    font-size:.95rem; padding:10px 26px;
  }
  .hidden { display:none !important; }
  .loop-emoji { font-size:3rem; letter-spacing:6px; text-align:center; margin:10px 0; }
  .love-btn { font-size:1.8rem; padding:10px 30px; }

  /* ===== POEM PAGE — fullscreen photo, faded poem ===== */
  .poem-fullscreen {
    position:fixed; inset:0;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    display:flex; justify-content:center; align-items:center;
    padding:24px;
    z-index:100;
    overflow-y:auto;
  }
  .poem-card {
    width:100%; max-width:720px;
    background: rgba(255,255,255,.35);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    border-radius:32px;
    padding:32px 26px;
    border:1px solid rgba(255,255,255,.5);
    box-shadow:0 20px 60px rgba(80,20,50,.35);
    margin:auto;
  }
  .horrah {
    font-size:2.2rem; font-weight:800;
    color:#fff;
    text-shadow:0 4px 16px rgba(180,60,110,.95), 0 0 24px rgba(255,150,200,.6);
    letter-spacing:2px; text-align:center;
    margin-bottom:16px;
  }
  .poem-text {
    font-size:1.05rem; line-height:1.95; white-space:pre-line;
    font-style:italic;
    color:#fff;
    text-align:center;
    padding:0 6px;
    text-shadow:0 2px 8px rgba(0,0,0,.85), 0 0 12px rgba(0,0,0,.6);
    font-weight:500;
  }
  .poem-actions {
    text-align:center; margin-top:24px;
  }

  /* ===== ADMIN PANEL ===== */
  .admin-panel {
    position:fixed; inset:0;
    background: rgba(30,10,20,.92);
    backdrop-filter: blur(10px);
    z-index:9999;
    display:flex; justify-content:center; align-items:center;
    padding:20px; overflow-y:auto;
  }
  .admin-box {
    width:100%; max-width:680px;
    background:#fff5f9;
    border-radius:32px;
    padding:28px 24px;
    box-shadow:0 25px 60px rgba(0,0,0,.5);
    border:2px solid #ffc1d6;
    max-height:90vh; overflow-y:auto;
  }
  .admin-box h2 { color:#b3416b; margin-bottom:18px; font-size:1.6rem; }
  .admin-section {
    background:#fff; border-radius:20px;
    padding:16px 18px; margin-bottom:14px;
    border:1px solid #ffd9e6;
    box-shadow:0 4px 10px rgba(220,130,160,.1);
  }
  .admin-label {
    font-size:.85rem; color:#b3416b; font-weight:600;
    text-transform:uppercase; letter-spacing:.5px;
    margin-bottom:6px; text-align:left;
  }
  .admin-value {
    font-size:1.05rem; color:#3e2a33; white-space:pre-wrap;
    word-break:break-word; text-align:left; font-style:italic;
  }
  .admin-value.empty { color:#bda2b2; font-style:normal; }
  .admin-actions {
    display:flex; gap:12px; justify-content:center;
    margin-top:20px; flex-wrap:wrap;
  }
  .admin-btn {
    padding:12px 28px; border:none; border-radius:50px;
    font-size:1rem; cursor:pointer; font-weight:500;
  }
  .admin-btn.close { background:#ffd9e6; color:#612f42; }
  .admin-btn.refresh { background:#c8f0d8; color:#1e5a35; }
  .admin-btn:hover { filter:brightness(.95); }
  .admin-status {
    font-size:.85rem; color:#b3416b; text-align:center;
    margin-bottom:12px; min-height:1.2em;
  }
</style>
</head>
<body>
<div class="game-container" id="gameContainer">
  <div id="screenContent"></div>
</div>

<!-- 🎵 YOUR SONGS -->
<audio id="audio1" src="song1.mp3"></audio>
<audio id="audio2" src="song2.mp3"></audio>
<audio id="audio3" src="song3.mp3"></audio>

<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // =============================================
  // ⚙️  PASTE YOUR SUPABASE INFO HERE
  // =============================================
  const SUPABASE_URL = 'https://ghcxcqdhjkaujykqzrwx.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_aCDCcbKUaY28JCOnjxfRMw_DDaFw7ZD';

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Unique session id per visitor (so you know which submission is hers)
  let SESSION_ID = localStorage.getItem('tifa_session_id');
  if (!SESSION_ID) {
    SESSION_ID = 'tifa_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
    localStorage.setItem('tifa_session_id', SESSION_ID);
  }

  // ===== SAVE ANSWER TO SUPABASE =====
  async function saveAnswer(key, value) {
    // Also keep a local copy for instant admin view
    try {
      const local = JSON.parse(localStorage.getItem('tifa_local') || '{}');
      local[key] = value;
      local.updated = new Date().toLocaleString();
      localStorage.setItem('tifa_local', JSON.stringify(local));
    } catch(e) {}

    // Upsert to Supabase (one row per session)
    const { data: existing } = await supabase
      .from('tifa_answers')
      .select('id')
      .eq('session_id', SESSION_ID)
      .maybeSingle();

    if (existing) {
      await supabase.from('tifa_answers')
        .update({ [key]: value })
        .eq('session_id', SESSION_ID);
    } else {
      await supabase.from('tifa_answers')
        .insert({ session_id: SESSION_ID, [key]: value });
    }
  }

  // ===== LOAD ANSWERS (for admin) =====
  async function loadAnswers() {
    const { data, error } = await supabase
      .from('tifa_answers')
      .select('*')
      .order('created_at', { ascending: false })
      .limit(20);
    if (error) {
      console.error(error);
      return { error: error.message, rows: [] };
    }
    return { rows: data || [] };
  }

  // ===== MUSIC =====
  const songs = ['audio1','audio2','audio3'];
  let currentSong = 0, musicStarted = false;
  function playNextSong() {
    const el = document.getElementById(songs[currentSong]);
    el.play().catch(()=>{});
    el.onended = () => {
      currentSong = (currentSong + 1) % songs.length;
      playNextSong();
    };
  }
  function startMusic() {
    if (musicStarted) return;
    musicStarted = true;
    currentSong = 0;
    playNextSong();
  }

  // ===== STATE =====
  const screen = document.getElementById('screenContent');
  const loopEmojis = ['💭','🌸','✨','🌙','⭐','🦋','🌷','☁️','💫','🌻','🍃','🕊️'];
  let loopIndex = 0;

  // ===== SCREENS =====
  function showIntro() {
    screen.innerHTML = `
      <div class="emoji-big" id="secretTrigger">❤️</div>
      <h1 style="font-size:2.4rem;font-weight:600;margin-bottom:8px;">hello tifa ❤️</h1>
      <p class="question-text">are you ready to play this game?</p>
      <div class="btn-group">
        <button class="btn" id="yesBtn">Yes</button>
        <button class="btn btn-secondary" id="noBtn">No</button>
      </div>
    `;

    // hidden admin trigger: 5 quick taps on ❤️
    let tapCount = 0, tapTimer = null;
    document.getElementById('secretTrigger').addEventListener('click', () => {
      tapCount++;
      clearTimeout(tapTimer);
      tapTimer = setTimeout(() => tapCount = 0, 1200);
      if (tapCount >= 5) { tapCount = 0; showAdminPanel(); }
    });

    document.getElementById('yesBtn').onclick = () => { startMusic(); showHappyQuestion(); };
    document.getElementById('noBtn').onclick = () => {
      document.body.innerHTML = '<p style="text-align:center;margin-top:40vh;font-size:2rem;color:#b3416b;">bye tifa ❤️</p>';
    };
  }

  function showHappyQuestion() {
    screen.innerHTML = `
      <div class="emoji-big">😊✨</div>
      <p class="question-text">what was your most happiest day in your life?</p>
      <textarea id="happyInput" rows="3" placeholder="write here..."></textarea>
      <div class="btn-group"><button class="btn" id="next1">Next</button></div>
    `;
    const input = document.getElementById('happyInput');
    const saved = JSON.parse(localStorage.getItem('tifa_local') || '{}');
    if (saved.happiest) input.value = saved.happiest;
    document.getElementById('next1').onclick = async () => {
      await saveAnswer('happiest', input.value.trim());
      showSadQuestion();
    };
  }

  function showSadQuestion() {
    screen.innerHTML = `
      <div class="emoji-big">🥺💧</div>
      <p class="question-text">what was your saddest day in your life?</p>
      <textarea id="sadInput" rows="3" placeholder="it's ok... write it here"></textarea>
      <div class="btn-group"><button class="btn" id="next2">Next</button></div>
    `;
    const input = document.getElementById('sadInput');
    const saved = JSON.parse(localStorage.getItem('tifa_local') || '{}');
    if (saved.saddest) input.value = saved.saddest;
    document.getElementById('next2').onclick = async () => {
      await saveAnswer('saddest', input.value.trim());
      showHateQuestion();
    };
  }

  function showHateQuestion() {
    screen.innerHTML = `
      <div class="emoji-big">😤💢</div>
      <p class="question-text">what thing or behaviour do you hate the most?</p>
      <textarea id="hateInput" rows="3" placeholder="tell me..."></textarea>
      <div class="btn-group"><button class="btn" id="next3">Next</button></div>
    `;
    const input = document.getElementById('hateInput');
    const saved = JSON.parse(localStorage.getItem('tifa_local') || '{}');
    if (saved.hates) input.value = saved.hates;
    document.getElementById('next3').onclick = async () => {
      await saveAnswer('hates', input.value.trim());
      showCrushQuestion();
    };
  }

  function showCrushQuestion() {
    screen.innerHTML = `
      <div class="emoji-big">🤫💗</div>
      <p class="question-text">now the game begins 😂</p>
      <p class="small-question">name your crush or your boyfriend — it's a secret 🤐</p>
      <input type="text" id="crushInput" placeholder="type a name...">
      <div class="btn-group">
        <button class="btn btn-secondary" id="noCrushBtn">i don't have one</button>
      </div>
      <div class="btn-group hidden" id="nextGroup">
        <button class="btn" id="next4">Next</button>
      </div>
    `;
    const crushInput = document.getElementById('crushInput');
    const nextGroup = document.getElementById('nextGroup');
    crushInput.addEventListener('input', () => {
      nextGroup.classList.toggle('hidden', crushInput.value.trim().length === 0);
    });
    document.getElementById('next4').onclick = async () => {
      await saveAnswer('crush', crushInput.value.trim());
      showPoem();
    };
    document.getElementById('noCrushBtn').onclick = showLoopScreen;
  }

  function showLoopScreen() {
    loopIndex = (loopIndex + 1) % loopEmojis.length;
    const prompts = [
      'come on... just one name?',
      'really? no one at all?',
      'think harder... someone?',
      'ok but there has to be someone 👀',
      'just tell me... i won\'t tell anyone',
      'pretty please? 🌸',
      'not even a tiny crush?',
      'hmm... try again?',
      'someone makes your heart go 💓',
      'ok last hint... just a name?'
    ];
    screen.innerHTML = `
      <div class="loop-emoji">${loopEmojis[loopIndex]}</div>
      <p class="question-text">${prompts[loopIndex % prompts.length]}</p>
      <input type="text" id="crushInput" placeholder="type a name...">
      <div class="btn-group">
        <button class="btn btn-secondary" id="noCrushBtn">i don't have one</button>
      </div>
      <div class="btn-group hidden" id="nextGroup">
        <button class="btn" id="next4">Next</button>
      </div>
    `;
    const crushInput = document.getElementById('crushInput');
    const nextGroup = document.getElementById('nextGroup');
    crushInput.addEventListener('input', () => {
      nextGroup.classList.toggle('hidden', crushInput.value.trim().length === 0);
    });
    document.getElementById('next4').onclick = async () => {
      await saveAnswer('crush', crushInput.value.trim());
      showPoem();
    };
    document.getElementById('noCrushBtn').onclick = showLoopScreen;
  }

  function showPoem() {
    const page = document.createElement('div');
    page.className = 'poem-fullscreen';
    page.style.backgroundImage = "url('tifa.jpg')";
    page.innerHTML = `
      <div class="poem-card">
        <div class="horrah">horrahh $€!</div>
        <div class="poem-text">
hey tifa, best friend of mine,
let me roast you, just this time.
no hard feelings, no offence,
just some jokes at your expense.

you say you're dieting, you swear,
but that big belly's always there.
it giggles when you walk around,
the roundest tummy in the town.

at midnight when the world's asleep,
your phone is buzzing, secrets deep.
"just talking to a friend," you say,
but those boy chats last till break of day.

you tell me lies with such a face,
so innocent, so full of grace.
"i didn't see your text," you claim,
but whatsapp shows you read the same.

blue ticks, blue ticks, oh what a crime,
you leave me hanging every time.
i wait, i stare, i lose my mind,
you reply three days later — how kind.

you say "i'll call you back" — you won't,
you say "i forgot" — no you don't.
your memory's sharp for gossip news,
but my texts? always left on "view".

still, tifa, you're my closest friend,
a chaotic gem until the end.
fat belly, lies, and midnight chats,
i'd still choose you — imagine that.

so here's my roast, all wrapped in love,
a gift from me, sent from above.
you're messy, loud, and slightly mad,
but honestly — the best i've had.
        </div>
        <div class="poem-actions">
          <button class="btn love-btn" id="loveBtn">❤️</button>
        </div>
      </div>
    `;
    document.body.appendChild(page);
    document.getElementById('loveBtn').onclick = () => {
      document.body.style.transition = 'opacity .8s';
      document.body.style.opacity = '0';
      setTimeout(() => {
        document.body.innerHTML = '<p style="text-align:center;margin-top:40vh;font-size:2rem;color:#b3416b;">❤️</p>';
        document.body.style.opacity = '1';
      }, 800);
    };
  }

  // ===== ADMIN PANEL =====
  async function showAdminPanel() {
    const panel = document.createElement('div');
    panel.className = 'admin-panel';
    panel.innerHTML = `
      <div class="admin-box">
        <h2>🔒 Admin — Tifa's Answers</h2>
        <div class="admin-status" id="adminStatus">loading from supabase...</div>
        <div id="adminRows"></div>
        <div class="admin-actions">
          <button class="admin-btn refresh" id="adminRefresh">🔄 Refresh</button>
          <button class="admin-btn close" id="adminClose">Close</button>
        </div>
      </div>
    `;
    document.body.appendChild(panel);
    document.getElementById('adminClose').onclick = () => panel.remove();
    document.getElementById('adminRefresh').onclick = () => renderRows();
    panel.addEventListener('click', (e) => { if (e.target === panel) panel.remove(); });

    async function renderRows() {
      const status = document.getElementById('adminStatus');
      const rowsBox = document.getElementById('adminRows');
      status.textContent = 'loading from supabase...';
      const { rows, error } = await loadAnswers();
      if (error) {
        status.innerHTML = '❌ error: ' + error;
        rowsBox.innerHTML = '';
        return;
      }
      if (!rows.length) {
        status.textContent = 'no answers yet';
        rowsBox.innerHTML = '';
        return;
      }
      status.textContent = rows.length + ' submission(s) found';
      rowsBox.innerHTML = rows.map((r, i) => `
        <div class="admin-section">
          <div class="admin-label">#${i+1} · session ${r.session_id || '—'}</div>
          <div class="admin-label" style="margin-top:10px;">😊 happiest day</div>
          <div class="admin-value">${r.happiest || '<span class="empty">—</span>'}</div>
          <div class="admin-label" style="margin-top:10px;">🥺 saddest day</div>
          <div class="admin-value">${r.saddest || '<span class="empty">—</span>'}</div>
          <div class="admin-label" style="margin-top:10px;">😤 hates the most</div>
          <div class="admin-value">${r.hates || '<span class="empty">—</span>'}</div>
          <div class="admin-label" style="margin-top:10px;">💗 crush / boyfriend</div>
          <div class="admin-value">${r.crush || '<span class="empty">—</span>'}</div>
          <div class="admin-label" style="margin-top:10px;">🕒 submitted</div>
          <div class="admin-value">${r.created_at ? new Date(r.created_at).toLocaleString() : '—'}</div>
        </div>
      `).join('');
    }
    renderRows();
  }

  showIntro();
</script>
</body>
</html>
